# PAF pdebug configuration.  Values are optional; built-in defaults are used
# when this file or an individual setting is absent.

[bmc]
# endpoint = https://192.168.18.247
# username = ADMIN
# password_file = /etc/paf/bmc.password
timeout_ms = 10000
insecure_tls = false

[platform_can]
device = platform_can
log_enabled = false
log_file = /var/log/platform-telemetry.log
command_tx_id = 0x235803
telemetry_tx_id = 0x235801
heartbeat_id = 0x1B5BF800
response_start_id = 0x13402802
response_data_first_id = 0x13402022
response_data_last_id = 0x134020E2
response_data_id_step = 0x20
response_fast_end_id = 0x13403102
response_slow_end_id = 0x13403082
timeout_ms = 500
retries = 2
period_ms = 1000
