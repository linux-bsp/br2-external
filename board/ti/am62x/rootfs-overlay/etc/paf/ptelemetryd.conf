[daemon]
enabled = false
socket = /run/ptelemetryd.sock
ipc_socket = /run/ptelemetryd-ipc.sock
mcu = main_mcu
mcu_request_period_ms = 1000
log_enabled = false
log_file = /var/log/ptelemetryd.log

[bmc]
# BMC collection is disabled until an endpoint is configured.
# endpoint = https://192.168.18.247
# username = ADMIN
# password_file = /etc/paf/bmc.password
protocol = redfish
period_ms = 10000
timeout_ms = 5000
insecure_tls = false
